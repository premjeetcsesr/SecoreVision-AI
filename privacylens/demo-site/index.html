<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Fintech Careers & Merchant Portal - Application Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-6 selection:bg-emerald-500 selection:text-white">
  <div class="max-w-2xl mx-auto space-y-6">
    <!-- Header -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-lg">
            ₹
          </div>
          <div>
            <h1 class="text-lg font-bold text-white tracking-tight">FinTech Merchant & Executive Application</h1>
            <p class="text-xs text-slate-400">Kanpur Regional Banking & Technology Sandbox</p>
          </div>
        </div>
        <span class="text-xs font-mono px-2.5 py-1 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-full font-semibold">
          LIVE DEMO FORM
        </span>
      </div>
    </div>

    <!-- Form Container -->
    <form id="application-form" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5" onsubmit="event.preventDefault(); handleSubmit();">
      <div class="border-b border-slate-800 pb-3 flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">Candidate & Financial Verification</h2>
        <span class="text-xs text-slate-500 font-mono">Contains Realistic Test PII</span>
      </div>

      <!-- Full Name -->
      <div>
        <label for="full_name" class="block text-xs font-semibold text-slate-300 mb-1">Full Legal Name</label>
        <input
          type="text"
          id="full_name"
          name="full_name"
          placeholder="e.g., Rahul Sharma"
          value="Rahul Sharma"
          class="w-full text-xs p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500"
          required
        />
      </div>

      <!-- Email & Phone Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="e.g., rahul.sharma@example.in"
            value="rahul.sharma@example.in"
            class="w-full text-xs p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500"
            required
          />
        </div>
        <div>
          <label for="phone" class="block text-xs font-semibold text-slate-300 mb-1">Mobile Number (India)</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="e.g., +91 9876543210"
            value="+91 9876543210"
            class="w-full text-xs p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500"
            required
          />
        </div>
      </div>

      <!-- Aadhaar & PAN Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="aadhaar" class="block text-xs font-semibold text-slate-300 mb-1">Aadhaar Number (12 Digits)</label>
          <input
            type="text"
            id="aadhaar"
            name="aadhaar"
            placeholder="3849 2011 8829"
            value="3849 2011 8829"
            class="w-full text-xs font-mono p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500"
          />
        </div>
        <div>
          <label for="pan" class="block text-xs font-semibold text-slate-300 mb-1">PAN Card Number</label>
          <input
            type="text"
            id="pan"
            name="pan"
            placeholder="ABCDE1234F"
            value="ABCDE1234F"
            class="w-full text-xs font-mono uppercase p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500"
          />
        </div>
      </div>

      <!-- Payment Card & CVV -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="sm:col-span-2">
          <label for="card_number" class="block text-xs font-semibold text-slate-300 mb-1">Salary Credit Card Number</label>
          <input
            type="text"
            id="card_number"
            name="card_number"
            placeholder="4532 8812 9011 8821"
            value="4532 8812 9011 8821"
            class="w-full text-xs font-mono p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500"
          />
        </div>
        <div>
          <label for="cvv" class="block text-xs font-semibold text-slate-300 mb-1">CVV</label>
          <input
            type="password"
            id="cvv"
            name="cvv"
            placeholder="•••"
            value="742"
            maxlength="4"
            class="w-full text-xs font-mono p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500"
          />
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 mb-1">Account Access Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••••••"
          value="SecurePass@2026!"
          class="w-full text-xs p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500"
        />
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button
          type="submit"
          id="submit-btn"
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-950 transition-colors text-xs flex items-center justify-center gap-2"
        >
          <span>Submit Verified Merchant Application</span>
        </button>
      </div>
    </form>

    <!-- Submission Modal -->
    <div id="success-dialog" class="hidden bg-emerald-950/90 border border-emerald-800 rounded-2xl p-5 text-emerald-200 text-xs">
      <div class="font-bold text-white text-sm mb-1">Form Submitted Successfully!</div>
      <p>All fields were received and verified in this test session.</p>
    </div>
  </div>

  <script>
    function handleSubmit() {
      document.getElementById('success-dialog').classList.remove('hidden');
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
  </script>
</body>
</html>
