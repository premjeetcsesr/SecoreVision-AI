services:
  - type: web
    name: securevision-api
    runtime: python
    rootDir: privacylens/server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
